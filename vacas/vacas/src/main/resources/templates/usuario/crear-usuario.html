<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link rel="stylesheet" th:href="@{/styles/form.css}">
</head>
<body>
    <div class="form-container">
        <h2>Crear Usuario</h2>
        
        <!-- Form CORRECTO con th:object -->
        <form th:action="@{/usuario/crear}" th:object="${usuario}" method="post">

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" th:field="*{apellido}" required>

            <label for="nroCedula">Nro. de Cédula:</label>
            <input type="text" id="nroCedula" th:field="*{nroCedula}" required>
            <div th:if="${#fields.hasErrors('nroCedula')}" th:errors="*{nroCedula}" class="error"></div>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" th:field="*{correo}" required>

            <label for="idRol">Rol:</label>
            <select th:field="*{idRol}">
                <option value="" disabled selected>-- Seleccione un rol --</option>
                <option th:each="rol : ${roles}" 
                        th:value="${rol.id}" 
                        th:text="${rol.nombre}">
                </option>
            </select>
            <div th:if="${#fields.hasErrors('idRol')}" th:errors="*{idRol}" class="error"></div>

            <label for="idEquipo">Equipo:</label>
            <select th:field="*{idEquipo}">
                <option value="" disabled selected>-- Seleccione un equipo --</option>
                <option th:each="equipo : ${equipos}" 
                        th:value="${equipo.id}" 
                        th:text="${equipo.nombre}">
                </option>
            </select>
            <div th:if="${#fields.hasErrors('idEquipo')}" th:errors="*{idEquipo}" class="error"></div>

            <label for="idCargo">Cargo:</label>
            <select th:field="*{idCargo}">
                <option value="" disabled selected>-- Seleccione un cargo --</option>
                <option th:each="cargo : ${cargos}" 
                        th:value="${cargo.id}" 
                        th:text="${cargo.nombre}">
                </option>
            </select>
            <div th:if="${#fields.hasErrors('idCargo')}" th:errors="*{idCargo}" class="error"></div>

            <label for="fechaIngreso">Fecha de Ingreso:</label>
            <input type="date" id="fechaIngreso" th:field="*{fechaIngreso}" required>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" th:field="*{telefono}" required>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" th:field="*{contrasena}" required>

            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" required>

            <button type="submit" class="full-width">Crear Usuario</button>
            <a th:href="@{/}" class="button">Volver al Inicio</a>


        </form>
    </div>

    <!-- Popups de error o éxito -->
    <script th:if="${error}">
        alert('[[${error}]]');
    </script>

    
</body>
</html>
