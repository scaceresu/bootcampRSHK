<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/form.css"/>
  <title>Registrar Producto</title> 
</head>
<body>
    <div class="form-container">

        <h1>Registrar Producto</h1>
        <form action="/tabla-dinamica-1.0-SNAPSHOT/registroProducto" method="post">
            <label for="nombre">Nombre del Producto:</label>
            <input type="text" id="nombre" name="nombre" required>
            
            <label for="precio">Precio:</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0" required>
            
            <label for="proveedor_id">Proveedor ID:</label>
            <input type="number" id="proveedor_id" name="proveedor_id" min="1" step="1" required>
            
            <label for="costo">Costo:</label>
            <input type="number" id="costo" name="costo" step="0.01" min="0" required>
            
            <button type="submit">Guardar</button>
        </form>
    </div>
</body>
</html>
